name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Verify original Python source syntax
        run: python -m compileall -q app/src/main/python
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: TG-WS-Proxy-1.11.4-Android-arm64-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
