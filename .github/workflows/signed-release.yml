name: Build signed release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Restore private signing keystore
        shell: bash
        env:
          TGWS_SIGNING_KEYSTORE_BASE64: ${{ secrets.TGWS_SIGNING_KEYSTORE_BASE64 }}
          TGWS_SIGNING_STORE_PASSWORD: ${{ secrets.TGWS_SIGNING_STORE_PASSWORD }}
          TGWS_SIGNING_KEY_ALIAS: ${{ secrets.TGWS_SIGNING_KEY_ALIAS }}
          TGWS_SIGNING_KEY_PASSWORD: ${{ secrets.TGWS_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in TGWS_SIGNING_KEYSTORE_BASE64 TGWS_SIGNING_STORE_PASSWORD TGWS_SIGNING_KEY_ALIAS TGWS_SIGNING_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Required repository secret is missing: $secret_name" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$TGWS_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tgws-dlcproxy-release.jks"
          echo "TGWS_SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/tgws-dlcproxy-release.jks" >> "$GITHUB_ENV"

      - name: Check Python syntax
        run: python -m compileall -q app/src/main/python

      - name: Android UI checks
        run: python tests/test_android_ui_contract.py

      - name: Build signed release APK
        env:
          TGWS_SIGNING_STORE_PASSWORD: ${{ secrets.TGWS_SIGNING_STORE_PASSWORD }}
          TGWS_SIGNING_KEY_ALIAS: ${{ secrets.TGWS_SIGNING_KEY_ALIAS }}
          TGWS_SIGNING_KEY_PASSWORD: ${{ secrets.TGWS_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signature and prepare downloadable APK
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/release"
          original="$apk_dir/app-release.apk"
          test -f "$original"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$original"
          mv "$original" "$apk_dir/tgws-dlcproxy-v1.0-arm64.apk"
          (cd "$apk_dir" && sha256sum tgws-dlcproxy-v1.0-arm64.apk > SHA256SUMS.txt)

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TGWS-DLC-Proxy-v1.0-signed-arm64
          path: |
            app/build/outputs/apk/release/tgws-dlcproxy-v1.0-arm64.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/tgws-dlcproxy-release.jks"
