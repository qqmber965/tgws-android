plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'io.github.tgwsproxy.python114'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.tgwsproxy.python114'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.11.4-android.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        pip {
            install 'certifi'
            install 'httpx[http2]==0.28.1'
            // Newer cryptography releases have no prebuilt Android wheel.
            install 'cryptography==42.0.8'
        }
    }
}
