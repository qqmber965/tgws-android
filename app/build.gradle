plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'io.github.tgwsproxy.python114'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.tgwsproxy.python114'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // The signing key is supplied only during the manually triggered release workflow.
    // Do not place key files or passwords into the repository.
    signingConfigs {
        signedRelease {
            def signingStore = System.getenv('TGWS_SIGNING_KEYSTORE_FILE')
            if (signingStore) {
                storeFile file(signingStore)
                storePassword System.getenv('TGWS_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('TGWS_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('TGWS_SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('TGWS_SIGNING_KEYSTORE_FILE')) {
                signingConfig signingConfigs.signedRelease
            }
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        pip {
            install 'certifi'
            install 'httpx[http2]==0.28.1'
            // Newer cryptography releases have no prebuilt Android wheel.
            install 'cryptography==42.0.8'
        }
    }
}
